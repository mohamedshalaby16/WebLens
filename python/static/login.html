<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebLens — Login</title>
  <style>
    :root {
      --bg-primary:    #0d0d0d;
      --bg-card:       #141414;
      --border:        #2a2a2a;
      --border-focus:  #404040;
      --text-primary:  #f5f5f5;
      --text-secondary:#a0a0a0;
      --text-muted:    #555555;
      --accent:        #e8ff47;
      --critical:      #ef4444;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 28px;
    }

    .logo {
      text-align: center;
      margin-bottom: 4px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      border-color: var(--border-focus);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      padding: 11px 0;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s ease;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: var(--critical);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .admin-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 24px;
    }

    .role-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .role-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .destination-panel {
      display: none;
      text-align: center;
    }

    .destination-panel p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .destination-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-dest {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      padding: 11px 0;
      cursor: pointer;
    }

    .btn-dest:hover { opacity: 0.9; }

    .btn-dest.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <span class="logo-text">WebLens</span>
    </div>
    <p class="subtitle">Web Intelligence Platform</p>

    <div class="role-toggle">
      <button type="button" class="role-btn active" id="roleClientBtn" data-role="client">Sign in as Client</button>
      <button type="button" class="role-btn" id="roleAdminBtn" data-role="admin">Sign in as Admin</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Log In as Client</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <p class="admin-note" id="adminNote">Contact your administrator to get access</p>

    <div class="destination-panel" id="destinationPanel">
      <p>Signed in as <strong id="destUsername"></strong> (Admin). Where would you like to go?</p>
      <div class="destination-actions">
        <button class="btn-dest" id="goDashboardBtn">Open Admin Dashboard</button>
        <button class="btn-dest secondary" id="goCloningBtn">Open Cloning &amp; Jobs</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var form             = document.getElementById('loginForm');
      var errorMsg         = document.getElementById('errorMsg');
      var loginBtn          = document.getElementById('loginBtn');
      var roleClientBtn    = document.getElementById('roleClientBtn');
      var roleAdminBtn     = document.getElementById('roleAdminBtn');
      var adminNote        = document.getElementById('adminNote');
      var destinationPanel = document.getElementById('destinationPanel');
      var destUsername     = document.getElementById('destUsername');
      var goDashboardBtn   = document.getElementById('goDashboardBtn');
      var goCloningBtn     = document.getElementById('goCloningBtn');

      var selectedRole = 'client';

      function setSelectedRole(role) {
        selectedRole = role;
        roleClientBtn.classList.toggle('active', role === 'client');
        roleAdminBtn.classList.toggle('active', role === 'admin');
        loginBtn.textContent = role === 'admin' ? 'Log In as Admin' : 'Log In as Client';
        errorMsg.style.display = 'none';
      }

      roleClientBtn.addEventListener('click', function () { setSelectedRole('client'); });
      roleAdminBtn.addEventListener('click', function () { setSelectedRole('admin'); });

      function showDestinationChooser(username) {
        form.style.display = 'none';
        document.querySelector('.role-toggle').style.display = 'none';
        adminNote.style.display = 'none';
        destUsername.textContent = username;
        destinationPanel.style.display = 'block';
      }

      goDashboardBtn.addEventListener('click', function () {
        window.location.href = '/admin';
      });
      goCloningBtn.addEventListener('click', function () {
        window.location.href = '/';
      });

      // If already logged in, skip straight to the right place.
      var existingToken = localStorage.getItem('weblens_token');
      var existingUser  = JSON.parse(localStorage.getItem('weblens_user') || 'null');
      if (existingToken && existingUser) {
        if (existingUser.role === 'admin') {
          showDestinationChooser(existingUser.username);
        } else {
          window.location.href = '/';
        }
        return;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.style.display = 'none';
        loginBtn.disabled = true;

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        try {
          var res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password }),
          });

          var data = await res.json().catch(function () {
            throw new Error('Unexpected response from server. Please try again.');
          });

          if (res.status === 401) {
            throw new Error(data.detail || 'Invalid email or password.');
          }
          if (res.status === 403) {
            throw new Error(data.detail || 'This account has been disabled. Contact your administrator.');
          }
          if (!res.ok) {
            throw new Error(data.detail || 'Login failed. Please try again.');
          }

          if (data.user.role !== selectedRole) {
            var actualLabel  = data.user.role === 'admin' ? 'an administrator' : 'a client';
            var correctLabel = data.user.role === 'admin' ? "'Sign in as Admin'" : "'Sign in as Client'";
            throw new Error(
              'This account is registered as ' + actualLabel +
              '. Please use ' + correctLabel + ' to log in.'
            );
          }

          localStorage.setItem('weblens_token', data.access_token);
          localStorage.setItem('weblens_user', JSON.stringify(data.user));

          if (data.user.role === 'admin') {
            showDestinationChooser(data.user.username);
          } else {
            window.location.href = '/';
          }
        } catch (err) {
          errorMsg.textContent = err.message || 'Invalid email or password';
          errorMsg.style.display = 'block';
        } finally {
          loginBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
