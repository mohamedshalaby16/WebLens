<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebLens — Login</title>
  <style>
    :root {
      --bg-primary:    #0d0d0d;
      --bg-card:       #141414;
      --border:        #2a2a2a;
      --border-focus:  #404040;
      --text-primary:  #f5f5f5;
      --text-secondary:#a0a0a0;
      --text-muted:    #555555;
      --accent:        #e8ff47;
      --critical:      #ef4444;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 28px;
    }

    .logo {
      text-align: center;
      margin-bottom: 4px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      border-color: var(--border-focus);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      padding: 11px 0;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s ease;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: var(--critical);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .admin-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <span class="logo-text">WebLens</span>
    </div>
    <p class="subtitle">Web Intelligence Platform</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Log In</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <p class="admin-note">Contact your administrator to get access</p>
  </div>

  <script>
    (function () {
      if (localStorage.getItem('weblens_token')) {
        window.location.href = '/';
        return;
      }

      var form = document.getElementById('loginForm');
      var errorMsg = document.getElementById('errorMsg');
      var loginBtn = document.getElementById('loginBtn');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.style.display = 'none';
        loginBtn.disabled = true;

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        try {
          var res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password }),
          });

          var data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || 'Login failed');
          }

          localStorage.setItem('weblens_token', data.access_token);
          localStorage.setItem('weblens_user', JSON.stringify(data.user));

          if (data.user.role === 'admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } catch (err) {
          errorMsg.textContent = err.message || 'Invalid email or password';
          errorMsg.style.display = 'block';
        } finally {
          loginBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
